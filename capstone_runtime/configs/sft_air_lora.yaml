# LLaMA Factory SFT LoRA config — step 09.
# DOUBLE-CHECK: model_name_or_path, dataset path (need to register in
# data/dataset_info.json), output_dir.

### model
model_name_or_path: ckpt/midtrain_final_long
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all                    # ≈ all-linear: q,k,v,o,gate,up,down

### dataset
dataset: sft_combined               # register in data/dataset_info.json
template: glm4                      # IMPORTANT: must match model family
cutoff_len: 8192
max_samples: null
overwrite_cache: true
preprocessing_num_workers: 16
packing: true                       # don't skip — pad cost is huge
neftune_noise_alpha: 5.0

### output
output_dir: ckpt/sft_lora_r64
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
report_to: none                     # or wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16     # global_bs = 1 × 16 × 8 GPU = 128
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.01
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500

### deepspeed
deepspeed: configs/ds_z3_config.json
